<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coș de cumpărături - CarpShop</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/cos.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">
        <a href="../index.html" style="text-decoration: none; color: inherit;">Carp<span>Shop</span></a>
      </div>
      <ul class="nav-links">
        <li><a href="../index.html">Acasă</a></li>
        <li><a href="../html/produse.html">Produse</a></li>
        <li><a href="../html/contacte.html">Contacte</a></li>
        <li><a href="../html/cos.html" class="active">Coș <span class="cart-badge">0</span></a></li>
      </ul>
    </nav>
  </header>

  <main class="cart-page">
    <h1>Coșul tău</h1>
    <p class="subtitle">Produsele adăugate sunt păstrate automat.</p>

    <div id="cart-items"></div>

    <div class="cart-summary">
      <div class="total">
        Total: <span id="cart-total">0 lei</span>
      </div>
      <button id="clear-cart">Golește coșul</button>
    </div>

    <div id="checkout-section" class="checkout-form" style="display: none; margin-top: 40px; text-align: left; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.07);">
      <h2 style="color: #0a1f44; margin-bottom: 20px; border-bottom: 2px solid #f1f1f1; padding-bottom: 10px;">Date Livrare</h2>
      
      <form id="form-comanda">
        <div style="margin-bottom: 15px;">
          <label for="nume-client" style="font-weight: bold; color: #555;">Nume și Prenume:</label><br>
          <input type="text" id="nume-client" placeholder="Ex: Ion Popescu" required style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit;">
        </div>
        
        <div style="margin-bottom: 15px;">
          <label for="telefon-client" style="font-weight: bold; color: #555;">Telefon:</label><br>
          <input type="tel" id="telefon-client" placeholder="Ex: 0722 000 000" required style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit;">
        </div>
        
        <div style="margin-bottom: 25px;">
          <label for="adresa-client" style="font-weight: bold; color: #555;">Adresa completă:</label><br>
          <textarea id="adresa-client" rows="3" placeholder="Oraș, Stradă, Număr..." required style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; resize: vertical;"></textarea>
        </div>
        
        <button type="submit" id="btn-trimite-comanda" style="background: #0a1f44; color: white; border: none; padding: 15px 20px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.3s;">Finalizează Comanda</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 CarpShop. Fir întins!</p>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/cos.js"></script>
</body>
</html>
