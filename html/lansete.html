<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lansete - CarpShop</title>
    <link rel="stylesheet" href="../css/lansete.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="../index.html" style="text-decoration: none; color: inherit;">Carp<span>Shop</span></a>
            </div>
            <ul class="nav-links">
                <li><a href="../index.html">Acasă</a></li>
                <li><a href="../html/produse.html">Produse</a></li>
                <li><a href="../html/contacte.html">Contacte</a></li>
                <li><a href="../html/cos.html">Coș <span class="cart-badge">0</span></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="category-hero">
            <h1>Lansete și Undițe</h1>
            <p>Alege precizia și puterea pentru următoarea ta captură.</p>
        </section>

        <div class="container">
            <div class="filter-box">
                 <input type="text" id="searchInput" placeholder="Caută produs...">
            </div>
            <div class="product-grid">
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 CarpShop. Fir întins!</p>
    </footer>

    <script src="../js/app.js"></script>
<script>
incarcaProduse('lansete');

document.getElementById("searchInput").addEventListener("input", function() {
  const value = this.value.toLowerCase();
  document.querySelectorAll(".product-card").forEach(card => {
    const name = card.querySelector("h3").innerText.toLowerCase();
    if (name.includes(value)) {
      card.style.display = "flex";
    } else {
      card.style.display = "none";
    }
  });
});
</script>
</body>
</html>
